<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="dash.css">
</head>

<body>
    <section id="menu">
        <button id="botao_menu" onclick="abrir_menu()">
            <img src="../assets/menu-icon.svg" style="height: 2rem; width: 2rem;">
        </button>

        <div id="div_menu" class="div_links">

            <div class="div_logo_menu">
                <div class="icone_logo"><img src="../assets/icone_logo.png" id="logo_menu"></div>

                <div class="texto_logo">
                    <h1>Fichas em Tormenta </h1>
                    <span>Estilos de Jogo</span>
                </div>
            </div>

            <div class="links_dash">
                <a href="home_dash.html">
                    <img src="../assets/dashboard/icone_home.svg" class="icone_menu"> Recepção
                </a>
                <a href="perguntas.html" class="pagina_atual">
                    <img src="../assets/dashboard/icone_perguntas_ativo.svg" class="icone_menu"> Perguntas
                </a>
                <a href="relatorio.html">
                    <img src="../assets/dashboard/icone_relatorio.svg" class="icone_menu"> Relatório
                </a>
                <div class="div_botao_sair links_dash">
                    <a href="../home/index.html" data-logout> Sair </a>
                </div>
            </div>
        </div>
    </section>

    <section class="background_perguntas">
        <div class="container_perguntas">

            <!-- Cabeçalho -->
            <div class="cabecalho_superior">
                <h1>Perguntas</h1>
                <span class="contador_afirmacao" id="contador_afirmacao"></span>
            </div>

            <!-- Card Principal da Pergunta -->
            <div class="card_pergunta">
                <p class="texto_afirmacao" id="texto_afirmacao"></p>

                <div class="opcoes_container">
                    <button type="button" class="opcao_resposta" aria-pressed="false" onclick="selecionarOpcao(1)">
                        <h2>1</h2>
                        <p>Discordo totalmente</p>
                    </button>

                    <button type="button" class="opcao_resposta" aria-pressed="false" onclick="selecionarOpcao(2)">
                        <h2>2</h2>
                        <p>Discordo</p>
                    </button>

                    <button type="button" class="opcao_resposta" aria-pressed="false" onclick="selecionarOpcao(3)">
                        <h2>3</h2>
                        <p>Neutro</p>
                    </button>

                    <button type="button" class="opcao_resposta" aria-pressed="false" onclick="selecionarOpcao(4)">
                        <h2>4</h2>
                        <p>Concordo</p>
                    </button>

                    <button type="button" class="opcao_resposta" aria-pressed="false" onclick="selecionarOpcao(5)">
                        <h2>5</h2>
                        <p>Concordo totalmente</p>
                    </button>
                </div>

                <!-- Mensagem de erro (fica escondida enquanto estiver vazia) -->
                <p class="erro_pergunta" id="erro_pergunta"></p>
            </div>

            <!-- Rodapé com Botões e Aviso -->
            <div class="rodape_perguntas">
                <p class="aviso_teste">A pergunta avança automaticamente após a resposta. Ao concluir, o relatório é atualizado.</p>
            </div>

        </div>
    </section>

    <script src="auth.js"></script>
    <script src="perguntas_dados.js"></script>
    <script>
        function abrir_menu() {
            const menu = document.getElementById('div_menu');
            menu.classList.toggle('active');
        }

        let contador = 0;
        const respostas = Perguntas.map(() => null);

        function mostrarPergunta() {
            document.getElementById('texto_afirmacao').textContent = Perguntas[contador].pergunta;
            document.getElementById('contador_afirmacao').textContent = 'Afirmação ' + (contador + 1) + ' de ' + Perguntas.length;
            document.getElementById('erro_pergunta').textContent = '';

            // marca só a opção escolhida (a nota 1 fica na posição 0, e assim por diante)
            const opcoes = document.querySelectorAll('.opcao_resposta');
            for (let i = 0; i < opcoes.length; i++) {
                opcoes[i].classList.remove('selecionada');
                opcoes[i].setAttribute('aria-pressed', 'false');
            }
            if (respostas[contador] !== null) {
                opcoes[respostas[contador] - 1].classList.add('selecionada');
                opcoes[respostas[contador] - 1].setAttribute('aria-pressed', 'true');
            }
        }

        function selecionarOpcao(nota) {
            respostas[contador] = nota;
            if (contador === Perguntas.length - 1) {
                gravarRespostas();
            } else {
                contador++;
                mostrarPergunta();
            }
        }

        async function gravarRespostas() {
            const erro = document.getElementById('erro_pergunta');
            const opcoes = document.querySelectorAll('.opcao_resposta');
            opcoes.forEach((opcao) => { opcao.disabled = true; });
            erro.textContent = '';
            const respostasParaEnviar = Perguntas.map((_, i) => ({
                pergunta_id: i + 1,
                valor: respostas[i]
            }));

            try {
                const resposta = await fetch('/api/questionario/respostas', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ respostas: respostasParaEnviar })
                });
                const dados = await resposta.json();
                if (resposta.status === 401) {
                    window.location.replace('../login_cadastro/login_cad.html');
                    return;
                }
                if (!resposta.ok) {
                    throw new Error(dados.mensagem || 'Não foi possível salvar suas respostas.');
                }
                window.location.href = 'relatorio.html';
            } catch (erroSalvar) {
                console.error('Não foi possível salvar as respostas.', erroSalvar);
                erro.textContent = erroSalvar.message || 'Não foi possível salvar suas respostas. Tente novamente.';
                opcoes.forEach((opcao) => { opcao.disabled = false; });
            }
        }

        mostrarPergunta();
    </script>

</body>

</html>
